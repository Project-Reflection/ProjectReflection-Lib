plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.7'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.3.35'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}
repositories {
    maven {
        // RetroFuturaGradle
        name 'GTNH Maven'
        url = "https://nexus.gtnewhorizons.com/repository/public/"
        mavenContent {
            includeGroup 'com.gtnewhorizons'
            includeGroup 'com.gtnewhorizons.retrofuturagradle'
        }
    }
    maven {
        name 'SpongePowered Maven'
        url 'https://repo.spongepowered.org/maven'
        mavenContent {
            includeGroup 'org.spongepowered'
        }
    }
    maven{
        url 'https://api.modrinth.com/maven'
        mavenContent {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
    mavenLocal()
}
def mod_version= format("%x",System.currentTimeMillis())

version = "${mod_version}"
group = "${mod_id}"
archivesBaseName = '`' + "${mod_name}"

java.toolchain {
    languageVersion = JavaLanguageVersion.of(8)
    vendor = JvmVendorSpec.AZUL
}
//java.withSourcesJar()
//java.withJavadocJar()

minecraft {
    mcVersion = '1.12.2'

    // MCP Mappings
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'

    // Set username here, the UUID will be looked up automatically
    username = 'Developer'

    // Add any additional tweaker classes here
    // extraTweakClasses.add('org.spongepowered.asm.launch.MixinTweaker')

    // Add various JVM arguments here for runtime
    def args = ["-ea:${project.group}"]
    args << '-Dfml.coreMods.load=' + mixin_loader_class
    args << '-Dmixin.hotSwap=true'
    args << '-Dmixin.checks.interfaces=true'
    args << '-Dmixin.debug.export=true'
    extraRunJvmArguments.addAll(args)

    // Include and use dependencies' Access Transformer files
    useDependencyAccessTransformers = true

    // Add any properties you want to swap out for a dynamic value at build time here
    // Any properties here will be added to a class at build time, the name can be configured below
    // Example:
    // injectedTags.put('VERSION', project.version)
    // injectedTags.put('MOD_ID', project.archives_base_name)
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    def mixin = modUtils.enableMixins('org.spongepowered:mixin:0.8.7', "mixins.${mod_id}.refmap.json")
    api (mixin) {
        transitive = false
    }
    shadow(mixin)
    api 'io.github.llamalad7:mixinextras-common:0.4.1'
    shadow 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    // implementation rfg.deobf('maven.modrinth:firstaid:1.6.22')
}

//mixin {
//    add sourceSets.main, "mixins.${mod_id}.refmap.json"
//}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", minecraft_version

    filesMatching('mcmod.info') {
        expand 'mod_id': mod_id, 'mod_name': mod_name, 'version': project.version,
                'mcversion': minecraft_version, 'mod_description': mod_description,
                'mod_author': mod_author
    }
}
tasks{
    shadowJar {
        configurations = [project.configurations.shadow]
        mergeServiceFiles()

        exclude 'org/spongepowered/asm/launch/MixinLaunchPlugin*'
        exclude 'org/spongepowered/asm/launch/MixinTransformationService*'
        exclude 'org/spongepowered/asm/launch/platform/container/ContainerHandleModLauncherEx*'
        minimize()

        archiveClassifier.set('')
    }

    reobfJar {
        inputJar.set(shadowJar.archiveFile)
    }
}
jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_name,
                "Specification-Version"   : "1",
                "Implementation-Title"    : mod_name,
                "Implementation-Version"  : mod_version,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "FMLCorePlugin": "${mixin_loader_class}",
                //"FMLCorePluginContainsFMLMod": "true",
                //"ForceLoadAsMod": "true",
                "TweakClass": "org.spongepowered.asm.launch.MixinTweaker"
        ])
    }

    archiveClassifier.set('THIN')
}

build.dependsOn(shadowJar)
jar.finalizedBy('reobfJar')